[package]
name = "ghost-sandbox"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "tests/lib.rs"

[dev-dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
near-workspaces = { version = "0.22", features = ["unstable"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", features = ["full"] }
