# cargo deny check. Run from contract/.
[graph]
all-features = false

[advisories]
# Every ignore names who pulls the crate in and why it cannot reach the deployed wasm.
ignore = [
  # crypto-bigint 0.5.5 timing variability: only via k256, a dev-dependency used to sign test vectors.
  { id = "RUSTSEC-2026-0387", reason = "dev-dependency only (k256 in tests); not in the wasm" },
  # unsafe-libyaml unmaintained: near-parameters, pulled by near-sdk's native unit-testing build only.
  { id = "RUSTSEC-2024-0449", reason = "native test build only (near-sdk unit-testing); not in the wasm" },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "Zlib", "MPL-2.0", "BSL-1.0", "CDLA-Permissive-2.0", "0BSD", "Unlicense"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
