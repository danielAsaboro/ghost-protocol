[package]
name = "ghost-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
ghost-protocol = { path = "..", default-features = false }
alloy-rlp = "0.3"
near-sdk = { version = "5.30", features = ["unit-testing", "unstable", "non-contract-usage"] }

[[bin]]
name = "parsers"
path = "fuzz_targets/parsers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rlp"
path = "fuzz_targets/rlp.rs"
test = false
doc = false
bench = false
