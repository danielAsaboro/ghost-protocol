[package]
name = "ghost-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/danielAsaboro/ghost-protocol"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["unstable"] }

[features]
# Lets `cargo kani` compile near-sdk natively. Never used for the wasm build.
kani-proofs = ["near-sdk/non-contract-usage"]

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing", "unstable"] }
ed25519-dalek = "2"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
proptest = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
